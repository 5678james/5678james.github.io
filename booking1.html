<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>快速連結</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #fff0f3;
      padding: 20px;
    }

    .container {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
      max-width: 400px;
      background: #ffffff;
      padding: 32px 24px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(255, 117, 143, 0.15);
      border: 1px solid #ffccd5;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 14px 20px;
      font-size: 16px;
      font-weight: 600;
      text-align: center;
      text-decoration: none;
      color: #ffffff;
      background-color: #ff758f;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(255, 117, 143, 0.3);
      transition: all 0.2s ease;
    }

    .btn:hover {
      background-color: #ff4d6d;
      box-shadow: 0 6px 14px rgba(255, 77, 109, 0.4);
      transform: translateY(-2px);
    }

    .btn:active {
      transform: translateY(0) scale(0.98);
    }

    /* 針對平板與桌面螢幕的響應式調整 */
    @media (min-width: 600px) {
      .container {
        max-width: 600px;
        flex-direction: row;
      }

      .btn {
        flex: 1;
      }
    }
  </style>
</head>
<body>

    <a href="https://kentaitwds2.github.io/off_days_viewer.html" target="_blank" rel="noopener noreferrer" class="btn">測試</a>
  </div>

</body>
</html>
